global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vehicle-intelligence-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]

  - job_name: vehicle-intelligence-retention
    metrics_path: /metrics
    static_configs:
      - targets: [retention-worker:9101]
