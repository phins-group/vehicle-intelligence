name: Build PicoDet training image

on:
  workflow_dispatch:
  push:
    branches:
      - build/training-image-v1
    paths:
      - .github/workflows/training-image.yml
      - Dockerfile.training
      - README.md
      - pyproject.toml
      - configs/model-training.hf.yaml
      - src/**

permissions:
  contents: read
  packages: write

concurrency:
  group: training-image-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable training image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.training
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-cam-picodet-trainer:v1
            ghcr.io/${{ github.repository_owner }}/smart-cam-picodet-trainer:git-${{ github.sha }}
          cache-from: type=gha,scope=picodet-trainer-v1
          cache-to: type=gha,mode=max,scope=picodet-trainer-v1

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Training image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/smart-cam-picodet-trainer@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the published runtime on a clean runner
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smart-cam-picodet-trainer@${IMAGE_DIGEST}"
          pulled=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if docker pull "$IMAGE"; then
              pulled=true
              break
            fi
            if [[ "$attempt" -lt 8 ]]; then
              delay=$((attempt * 15))
              if [[ "$delay" -gt 45 ]]; then delay=45; fi
              echo "GHCR pull attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          if [[ "$pulled" != true ]]; then
            echo "unable to pull the published image after bounded retries" >&2
            exit 1
          fi
          docker run --rm "$IMAGE" python -c "import paddle; import ppdet; from vehicle_intelligence.training.config import load_training_settings; settings = load_training_settings('/workspace/configs/model-training.hf.yaml'); assert paddle.is_compiled_with_cuda(); assert settings.plate.paddledetection.repository_path.is_dir(); print('paddle=' + paddle.__version__ + ' cuda=true config=ok')"
          docker run --rm "$IMAGE" vehicle-model-training --help >/dev/null
