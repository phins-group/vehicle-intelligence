name: Build PicoDet training image

on:
  workflow_dispatch:
  push:
    branches:
      - build/training-image-v1
    paths:
      - .github/workflows/training-image.yml
      - Dockerfile.training
      - README.md
      - pyproject.toml
      - configs/model-training.hf.yaml
      - src/**

permissions:
  contents: read
  packages: write

concurrency:
  group: training-image-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable training image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.training
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-cam-picodet-trainer:v1
            ghcr.io/${{ github.repository_owner }}/smart-cam-picodet-trainer:git-${{ github.sha }}
          cache-from: type=gha,scope=picodet-trainer-v1
          cache-to: type=gha,mode=max,scope=picodet-trainer-v1

      - name: Smoke-test the published runtime
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smart-cam-picodet-trainer@${IMAGE_DIGEST}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" python -c "import paddle; import ppdet; from vehicle_intelligence.training.config import load_training_settings; settings = load_training_settings('/workspace/configs/model-training.hf.yaml'); assert paddle.is_compiled_with_cuda(); assert settings.plate.paddledetection.repository_path.is_dir(); print('paddle=' + paddle.__version__ + ' cuda=true config=ok')"
          docker run --rm "$IMAGE" vehicle-model-training --help >/dev/null

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Training image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/smart-cam-picodet-trainer@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
