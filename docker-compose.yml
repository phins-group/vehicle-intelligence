services:
  mongodb:
    image: mongo:8@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-init:
    image: mongo:8@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
          }
        '
        until mongosh --host mongodb:27017 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
          sleep 1
        done

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${VIP_MINIO__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${VIP_MINIO__SECRET_KEY:-minioadmin}
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-6h}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: unless-stopped
    # Lifespan cleanup drains two Redis subscribers and closes the shared Mongo
    # client. Transient network timeouts can exceed Compose's 10-second default.
    stop_grace_period: 30s
    environment:
      VIP_MONGODB__ENABLED: "true"
      VIP_MONGODB__URI: mongodb://mongodb:27017/?replicaSet=rs0
      VIP_MONGODB__DATABASE: vehicle_intelligence
      VIP_MONGODB__TRANSACTIONS_ENABLED: "true"
      VIP_REDIS__URL: redis://redis:6379/0
      VIP_REALTIME__ENABLED: ${VIP_REALTIME__ENABLED:-true}
      VIP_LIVE_MONITOR__ENABLED: ${VIP_LIVE_MONITOR__ENABLED:-true}
      VIP_LIVE_MONITOR__REDIS_CHANNEL: ${VIP_LIVE_MONITOR__REDIS_CHANNEL:-vehicle.live.frames}
      VIP_ONVIF_DISCOVERY__ENABLED: ${VIP_ONVIF_DISCOVERY__ENABLED:-true}
      VIP_ONVIF_DISCOVERY__TIMEOUT_SECONDS: ${VIP_ONVIF_DISCOVERY__TIMEOUT_SECONDS:-3.0}
      VIP_ONVIF_DISCOVERY__PROBE_RETRIES: ${VIP_ONVIF_DISCOVERY__PROBE_RETRIES:-2}
      VIP_ONVIF_DISCOVERY__MAXIMUM_RESULTS: ${VIP_ONVIF_DISCOVERY__MAXIMUM_RESULTS:-128}
      VIP_CAMERA_MANAGER__MAXIMUM_CONFIGURED_CAMERAS: ${VIP_CAMERA_MANAGER__MAXIMUM_CONFIGURED_CAMERAS:-256}
      VIP_CAMERA_MANAGER__BATCH_CREATE_LIMIT: ${VIP_CAMERA_MANAGER__BATCH_CREATE_LIMIT:-50}
      VIP_OBSERVABILITY__PROMETHEUS_ENABLED: ${VIP_OBSERVABILITY__PROMETHEUS_ENABLED:-true}
      VIP_OBSERVABILITY__OPENTELEMETRY_ENABLED: ${VIP_OBSERVABILITY__OPENTELEMETRY_ENABLED:-false}
      VIP_OBSERVABILITY__OTLP_TRACES_ENDPOINT: ${VIP_OBSERVABILITY__OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      VIP_OBSERVABILITY__TRACE_SAMPLE_RATIO: ${VIP_OBSERVABILITY__TRACE_SAMPLE_RATIO:-0.1}
      VIP_STORAGE__BACKEND: minio
      VIP_MINIO__ENDPOINT: minio:9000
      VIP_MINIO__PUBLIC_ENDPOINT: ${VIP_MINIO__PUBLIC_ENDPOINT:-localhost:4200}
      VIP_MINIO__REGION: ${VIP_MINIO__REGION:-us-east-1}
      VIP_MINIO__ACCESS_KEY: ${VIP_MINIO__ACCESS_KEY:-minioadmin}
      VIP_MINIO__SECRET_KEY: ${VIP_MINIO__SECRET_KEY:-minioadmin}
      VIP_MINIO__SECURE: "false"
      VIP_MINIO__PUBLIC_SECURE: ${VIP_MINIO__PUBLIC_SECURE:-false}
      VIP_MINIO__PRESIGNED_URL_TTL_SECONDS: ${VIP_MINIO__PRESIGNED_URL_TTL_SECONDS:-300}
      VIP_AUTH__ENABLED: ${VIP_AUTH__ENABLED:-false}
      VIP_AUTH__PROVIDER: ${VIP_AUTH__PROVIDER:-api_key}
      VIP_AUTH__PRINCIPALS: ${VIP_AUTH__PRINCIPALS:-[]}
      VIP_SECURITY__CAMERA_CREDENTIAL_KEY: ${VIP_SECURITY__CAMERA_CREDENTIAL_KEY:-}
      VIP_SECURITY__CAMERA_CREDENTIAL_KEY_ID: ${VIP_SECURITY__CAMERA_CREDENTIAL_KEY_ID:-primary}
      VIP_DATASET_REVIEW__ENABLED: ${VIP_DATASET_REVIEW__ENABLED:-true}
      VIP_DATASET_REVIEW__SOURCES_DIRECTORY: /app/datasets/source/plate-first-party
      VIP_DATASET_REVIEW__WORKSPACE_DIRECTORY: /app/datasets/reviews/detector
      VIP_DATASET_REVIEW__PROMOTED_SOURCES_DIRECTORY: /app/datasets/source/plate-first-party
      VIP_DATASET_REGISTRY__ENABLED: ${VIP_DATASET_REGISTRY__ENABLED:-true}
      VIP_DATASET_REGISTRY__SOURCES_DIRECTORY: /app/datasets/source/plate-first-party
      VIP_DATASET_REGISTRY__EXPORTS_DIRECTORY: /app/datasets/detectors/plate
      VIP_DATASET_REGISTRY__WORKSPACE_DIRECTORY: /app/datasets/registry
      VIP_DATASET_REGISTRY__TRAINING_CONFIG: /app/configs/model-training.yaml
      VIP_DATASET_REGISTRY__RESTRICTED_PRIVATE_SYNC_ENABLED: ${VIP_DATASET_REGISTRY__RESTRICTED_PRIVATE_SYNC_ENABLED:-false}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./datasets:/app/datasets
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-4200}:8080"
    depends_on:
      - api

  event-worker:
    build: .
    profiles: ["event-driven"]
    restart: unless-stopped
    command: ["vehicle-event-worker"]
    environment:
      VIP_EVENT_BUS__BACKEND: redis
      VIP_REDIS__URL: redis://redis:6379/0
      VIP_MONGODB__ENABLED: "true"
      VIP_MONGODB__URI: mongodb://mongodb:27017/?replicaSet=rs0
      VIP_MONGODB__DATABASE: vehicle_intelligence
      VIP_MONGODB__TRANSACTIONS_ENABLED: "true"
      VIP_REALTIME__ENABLED: ${VIP_REALTIME__ENABLED:-true}
      VIP_IDENTITY__ENABLED: ${VIP_IDENTITY__ENABLED:-true}
      VIP_RULE_ENGINE__ENABLED: "true"
      VIP_RULE_ENGINE__EXTERNAL_ACTIONS_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully

  retention-worker:
    build: .
    profiles: ["maintenance"]
    restart: unless-stopped
    command: ["vehicle-retention-worker"]
    environment:
      VIP_MONGODB__ENABLED: "true"
      VIP_MONGODB__URI: mongodb://mongodb:27017/?replicaSet=rs0
      VIP_MONGODB__DATABASE: vehicle_intelligence
      VIP_STORAGE__BACKEND: minio
      VIP_MINIO__ENDPOINT: minio:9000
      VIP_MINIO__ACCESS_KEY: ${VIP_MINIO__ACCESS_KEY:-minioadmin}
      VIP_MINIO__SECRET_KEY: ${VIP_MINIO__SECRET_KEY:-minioadmin}
      VIP_MINIO__SECURE: "false"
      VIP_RETENTION__ENABLED: "true"
      VIP_RETENTION__WORKER_INTERVAL_SECONDS: ${VIP_RETENTION__WORKER_INTERVAL_SECONDS:-3600}
      VIP_RETENTION__BATCH_SIZE: ${VIP_RETENTION__BATCH_SIZE:-100}
      VIP_RETENTION__VEHICLE_EVENTS_DAYS: ${VIP_RETENTION__VEHICLE_EVENTS_DAYS:-365}
      VIP_RETENTION__SNAPSHOTS_DAYS: ${VIP_RETENTION__SNAPSHOTS_DAYS:-30}
      VIP_RETENTION__VEHICLE_CROPS_DAYS: ${VIP_RETENTION__VEHICLE_CROPS_DAYS:-30}
      VIP_RETENTION__PLATE_CROPS_DAYS: ${VIP_RETENTION__PLATE_CROPS_DAYS:-30}
      VIP_RETENTION__EVENT_CLIPS_DAYS: ${VIP_RETENTION__EVENT_CLIPS_DAYS:-14}
      VIP_RETENTION__DEBUG_IMAGES_DAYS: ${VIP_RETENTION__DEBUG_IMAGES_DAYS:-7}
      VIP_OBSERVABILITY__PROMETHEUS_ENABLED: ${VIP_OBSERVABILITY__PROMETHEUS_ENABLED:-true}
      VIP_OBSERVABILITY__RETENTION_METRICS_PORT: ${VIP_OBSERVABILITY__RETENTION_METRICS_PORT:-9101}
    expose:
      - "9101"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - api

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yml"]
    volumes:
      - ./infrastructure/otel/collector.yml:/etc/otelcol/collector.yml:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OTEL_HTTP_HOST_PORT:-4318}:4318"

  mediamtx:
    image: bluenviron/mediamtx:1@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
    profiles: ["rtsp-dev"]
    restart: unless-stopped
    environment:
      MTX_RTSPTRANSPORTS: tcp
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${RTSP_HOST_PORT:-8554}:8554"

volumes:
  mongodb_data:
  redis_data:
  minio_data:
  prometheus_data:
