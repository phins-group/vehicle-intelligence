[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-intelligence"
version = "0.1.0"
description = "Edge-first ANPR and vehicle intelligence pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.12",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.17,<5",
  "PyYAML>=6,<7",
  "redis>=7.4,<8",
  "uvicorn[standard]>=0.31,<1",
]

[project.optional-dependencies]
build = [
  "setuptools>=75",
  "wheel",
]
edge = [
  "paddlepaddle==3.2.2; sys_platform == 'linux'",
]
vision = [
  "paddleocr>=3.3,<4",
  "supervision>=0.27,<0.28",
  "ultralytics>=8.3,<9",
]
minio = ["minio>=7.2,<8"]
hub = ["huggingface-hub>=0.35,<2"]
reid = ["torch>=2.2,<3"]
optimization = [
  "onnx>=1.22,<2",
  # Keep the last macOS x86_64-compatible runtime separate from newer platforms.
  "onnxruntime>=1.20,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime>=1.24,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
training = [
  "huggingface-hub>=0.35,<2",
  "onnx>=1.22,<2",
]
dev = [
  "httpx2==2.10.0",
  "mypy>=1.20,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.uv]
required-version = "==0.8.8"

[project.scripts]
vehicle-pipeline = "vehicle_intelligence.interfaces.cli:main"
vehicle-camera = "vehicle_intelligence.interfaces.camera_cli:main"
vehicle-camera-supervisor = "vehicle_intelligence.interfaces.supervisor_cli:main"
vehicle-inference-service = "vehicle_intelligence.interfaces.inference_service_cli:main"
vehicle-event-worker = "vehicle_intelligence.interfaces.event_worker_cli:main"
vehicle-retention-worker = "vehicle_intelligence.interfaces.retention_cli:main"
vehicle-credential-rotation = "vehicle_intelligence.interfaces.credential_rotation_cli:main"
vehicle-edge-entrypoint = "vehicle_intelligence.interfaces.edge_entrypoint:main"
vehicle-dataset-export = "vehicle_intelligence.interfaces.dataset_export_cli:main"
vehicle-model-training = "vehicle_intelligence.training.cli:main"
vehicle-production-readiness = "vehicle_intelligence.interfaces.readiness_cli:main"
vehicle-api = "vehicle_intelligence.interfaces.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
# Incremental strict boundary for concurrency, audit, ReID, and capacity code.
# Add a module here whenever it is refactored to pass this gate.
files = [
  "src/vehicle_intelligence/application/audit.py",
  "src/vehicle_intelligence/application/cameras.py",
  "src/vehicle_intelligence/application/dataset_review.py",
  "src/vehicle_intelligence/application/event_policy.py",
  "src/vehicle_intelligence/application/event_worker.py",
  "src/vehicle_intelligence/application/gpu_scheduler.py",
  "src/vehicle_intelligence/application/production_readiness.py",
  "src/vehicle_intelligence/application/pipeline.py",
  "src/vehicle_intelligence/application/reid.py",
  "src/vehicle_intelligence/application/supervisor.py",
  "src/vehicle_intelligence/config.py",
  "src/vehicle_intelligence/domain/audit.py",
  "src/vehicle_intelligence/domain/geometry.py",
  "src/vehicle_intelligence/domain/reid.py",
  "src/vehicle_intelligence/infrastructure/audit_serialization.py",
  "src/vehicle_intelligence/infrastructure/inference/protocol.py",
  "src/vehicle_intelligence/infrastructure/inference/service.py",
  "src/vehicle_intelligence/infrastructure/inference/socket_path.py",
  "src/vehicle_intelligence/infrastructure/messaging/redis_streams.py",
  "src/vehicle_intelligence/infrastructure/observability/metrics.py",
  "src/vehicle_intelligence/infrastructure/persistence/camera_memory.py",
  "src/vehicle_intelligence/infrastructure/supervision/subprocess.py",
  "src/vehicle_intelligence/infrastructure/training/dataset_review_files.py",
  "src/vehicle_intelligence/interfaces/dataset_review_api.py",
  "src/vehicle_intelligence/interfaces/api.py",
  "src/vehicle_intelligence/interfaces/camera_api.py",
  "src/vehicle_intelligence/interfaces/event_worker_composition.py",
  "src/vehicle_intelligence/interfaces/event_worker_cli.py",
  "src/vehicle_intelligence/interfaces/composition.py",
  "src/vehicle_intelligence/interfaces/event_api.py",
  "src/vehicle_intelligence/interfaces/inference_service_cli.py",
  "src/vehicle_intelligence/interfaces/runtime_health_api.py",
  "src/vehicle_intelligence/interfaces/security.py",
  "src/vehicle_intelligence/interfaces/supervisor_cli.py",
  "src/vehicle_intelligence/infrastructure/vision/remote.py",
  "src/vehicle_intelligence/training/cli.py",
]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
